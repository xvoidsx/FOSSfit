# FOSSfit deb builder — builds on version tags, releases via GitHub Releases.
#
# Trigger: push a tag like v2.0.0
#   git tag v2.0.0 && git push origin v2.0.0
#
# Output: fossfit_2.0.0_amd64.deb attached to the GitHub Release.

name: build-deb

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build deb
        run: npx electron-builder --linux deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fossfit_*_amd64.deb
          name: FOSSfit ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
